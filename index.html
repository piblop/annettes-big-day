:root{--ink:#5a4230;--paper:#fff8e6;--pink:#ff9fb4;--pinkd:#e0577f;--shell:#f6e3bd;--sky:#8fd07a;--sun:#ffd98a;--leaf:#6fbf5a;--leafd:#4d9a3c;--orange:#f5a35c;--muted:#8a6f5a;--r:2.2cqw}
*{box-sizing:border-box}
html,body{margin:0;background-color:var(--sky);background-image:radial-gradient(circle at 20% 30%,rgba(255,255,255,.18) 0 6px,transparent 7px),radial-gradient(circle at 70% 70%,rgba(255,255,255,.14) 0 5px,transparent 6px),linear-gradient(135deg,rgba(0,0,0,.05) 25%,transparent 25%,transparent 50%,rgba(0,0,0,.05) 50%,rgba(0,0,0,.05) 75%,transparent 75%);background-size:180px 180px,140px 140px,28px 28px;color:var(--ink);touch-action:manipulation}
body{min-height:100vh;display:flex;justify-content:center;font-family:Fredoka,Figtree,system-ui,sans-serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#app{width:min(100%,780px);padding:14px;display:flex;flex-direction:column;gap:14px}
.shell{background:var(--shell);border:4px solid #c9a06a;border-radius:34px;padding:14px;box-shadow:0 10px 0 #b98a52,0 14px 24px rgba(60,40,10,.25);display:flex;flex-direction:column;gap:12px}
#hud{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
#chapterWrap{display:flex;flex-direction:column;gap:2px;min-width:0}
#chapter{font-size:clamp(16px,3.2vw,23px);font-weight:700;letter-spacing:.2px}
#clock{font-family:Fredoka,Figtree,sans-serif;font-size:12px;font-weight:600;color:var(--ink);background:rgba(255,255,255,.7);border-radius:999px;padding:1px 7px;width:-webkit-fit-content;width:fit-content;letter-spacing:.3px}
#hudBtns{display:flex;gap:8px}
.hbtn{border-radius:999px;font:inherit;font-size:14px;font-weight:600;padding:6px 14px;min-height:36px;background:var(--paper);border:3px solid #c9a06a;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 #c9a06a}
.hbtn{display:inline-flex;align-items:center;gap:6px}
.hbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:square;flex-shrink:0}
.hbtn .x{display:none}#muteBtn[aria-pressed="true"] .x{display:inline}#muteBtn[aria-pressed="true"] .w{display:none}
.hbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #c9a06a}
#stats{width:100%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.stat{display:flex;flex-direction:column;gap:3px;font-size:12px}
.stat span{display:flex;align-items:center;gap:4px}
.stat svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.stat i{display:block;height:10px;border-radius:6px;overflow:hidden;background:#fff;border:2px solid #c9a06a}
.stat b{display:block;height:100%;transition:width .4s,background .4s;background-image:linear-gradient(rgba(255,255,255,.45),rgba(255,255,255,0) 55%)}
.stat.pulse i{animation:pulse .7s steps(2) 2}
@keyframes pulse{50%{background:var(--sun)}}
.chapcard{border-radius:999px;margin:0 10cqw;position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);padding:2.4cqw 4cqw;background:var(--paper);color:var(--ink);border:.6cqw solid #c9a06a;text-align:center;font-size:max(15px,5cqw);font-weight:700;z-index:7;pointer-events:none;animation:chap 1.8s forwards}
@keyframes chap{0%{opacity:0}12%,72%{opacity:1}100%{opacity:0}}
#screen{position:relative;width:100%;aspect-ratio:3/2;border:4px solid #c9a06a;border-radius:18px;background:var(--ink);overflow:hidden;container-type:inline-size;box-shadow:inset 0 0 0 .6cqw rgba(255,255,255,.35)}
#game{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#ui{position:absolute;inset:0;font-size:max(12px,3.4cqw);pointer-events:none}
#ui>*{pointer-events:auto}
#toasts{position:absolute;top:2cqw;right:2cqw;display:flex;flex-direction:column;gap:1cqw;align-items:flex-end;pointer-events:none;z-index:6}
.toast{border-radius:999px;background:var(--paper);color:var(--ink);border:.4cqw solid #c9a06a;padding:.8cqw 2.4cqw;font-size:max(11px,2.6cqw);font-weight:600;white-space:nowrap;animation:toast 1.9s forwards;box-shadow:0 .5cqw 0 #c9a06a}
@keyframes toast{0%{opacity:0;transform:translateY(-1cqw)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#fade{position:absolute;inset:0;background:var(--ink);opacity:0;pointer-events:none;transition:opacity .3s;z-index:8}
#fade.on{opacity:1}
#np{position:absolute;left:1.6cqw;top:1.6cqw;max-width:56cqw;background:rgba(255,248,230,.9);color:var(--ink);font-weight:600;font-size:max(10px,2.5cqw);line-height:1.2;padding:.6cqw 1.4cqw;border-radius:1cqw;pointer-events:none;z-index:5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dialog{border-radius:3cqw;position:absolute;left:2.5cqw;right:2.5cqw;bottom:2.5cqw;min-height:15cqw;padding:3.8cqw 4.5cqw 3cqw;background:var(--paper);border:.7cqw solid #e2c88f;box-shadow:0 .9cqw 0 #c9a06a;line-height:1.35;font-weight:500}
.dialog p{margin:0}
.dialog .tag{border-radius:999px;position:absolute;left:3cqw;top:-3.8cqw;padding:.4cqw 2.4cqw;background:var(--leaf);color:#fff;border:.5cqw solid #fff;font-weight:700;font-size:max(11px,3cqw);box-shadow:0 .4cqw 0 var(--leafd)}
.dialog .more{position:absolute;right:2.4cqw;bottom:1.8cqw;width:0;height:0;border-left:1.2cqw solid transparent;border-right:1.2cqw solid transparent;border-top:1.4cqw solid var(--orange);animation:bob .6s steps(2) infinite}
.dialog.paulo{background:#eef6ff;border-color:#bcd6f2;box-shadow:0 .9cqw 0 #8fb6df}
.dialog.paulo .tag{background:#4f8fd6;box-shadow:0 .4cqw 0 #2f6bb0}
.dialog.paulo .more{border-top-color:#4f8fd6}
@keyframes bob{50%{transform:translateY(.6cqw)}}
.panel{border-radius:3cqw;position:absolute;inset:0 6cqw;margin:auto 0;height:-webkit-fit-content;height:fit-content;max-height:calc(100% - 8cqw);background:var(--paper);border:.7cqw solid #e2c88f;box-shadow:0 .9cqw 0 #c9a06a;padding:3cqw 3.5cqw;display:flex;flex-direction:column;gap:1.8cqw;overflow:auto}
.panel h2{margin:0;font-size:5cqw;line-height:1}
.panel p{margin:0}
.sub{font-family:Fredoka,Figtree,sans-serif;font-weight:500;font-size:max(11px,2.6cqw);color:var(--muted)}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; G.t += dt;
  if (G.dlg) {
    const d = G.dlg, line = d.lines[d.i];
    if (d.shown < line.t.length) {
      const prev = Math.floor(d.shown); d.shown = Math.min(line.t.length, d.shown + dt * 55);
      const n = Math.floor(d.shown);
      if (n !== prev) { d.p.textContent = line.t.slice(0, n); if (n % 3 === 0) sfx('talk'); }
      if (d.shown >= line.t.length) d.more.hidden = false;
    }
  }
  if (G.scene === 'map') updateMap(dt);
  else if (G.scene === 'drive') updateDrive(dt);
  else if (G.scene === 'finale' || G.scene === 'credits') updateFinale(dt);
  if (G.mode === 'lift') updateLift(dt);
  if (G.mode === 'fetch') updateFetch(dt);
  if (G.mode === 'pet') updatePet(dt);
  nowPlaying(); tickClock(dt);
  ctx.setTransform(2, 0, 0, 2, 0, 0); ctx.imageSmoothingEnabled = false; ctx.clearRect(0, 0, 240, 160);
  if (G.scene === 'title') renderTitle();
  else if (G.scene === 'map') renderMap();
  else if (G.scene === 'drive') renderDrive();
  else if (G.scene === 'lunch') renderLunch();
  else if (G.scene === 'battle') renderBattle();
  else if (G.scene === 'finale' || G.scene === 'credits') renderFinale();
  else if (G.scene === 'wnight') renderWNight();
  else if (G.scene === 'wend') renderWEnd();
  else if (G.scene === 'fetch') renderFetch();
  else if (G.scene === 'pet') renderPet();
  requestAnimationFrame(loop);
}

  const w = makeBtn('Weekend Adventure', () => startWeekend()); w.classList.add('start');
  w.style.bottom = '14cqw'; w.style.animation = 'none'; w.style.background = 'var(--leaf)'; w.style.borderColor = '#fff'; w.style.boxShadow = '0 .6cqw 0 #2f7d59'; w.style.fontSize = 'max(11px,3cqw)'; w.style.padding = '1cqw 4cqw';
  ui.append(b, w); setMenu([b, w]); music('title');
}
showTitle();
requestAnimationFrame(loop);
</script>
