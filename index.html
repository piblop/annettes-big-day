:root{--ink:#231d33;--paper:#ffffff;--pink:#ff6f91;--pinkd:#d6336c;--shell:#ff9fb8;--sky:#e9f3ff;--sun:#ffd166;--muted:#4d4764}
*{box-sizing:border-box}
html,body{margin:0;background:var(--sky);color:var(--ink);touch-action:manipulation}
body{min-height:100vh;display:flex;justify-content:center;font-family:'Pixelify Sans',ui-monospace,monospace;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#app{width:min(100%,780px);padding:14px;display:flex;flex-direction:column;gap:14px}
.shell{background:var(--shell);border:4px solid var(--ink);border-radius:22px 22px 56px 22px;padding:14px;box-shadow:8px 8px 0 var(--ink);display:flex;flex-direction:column;gap:12px}
#hud{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
#chapter{font-size:clamp(15px,3.2vw,22px);font-weight:700}
#hudBtns{display:flex;gap:8px}
.hbtn{font:inherit;font-size:14px;padding:6px 12px;min-height:36px;background:var(--paper);border:3px solid var(--ink);color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.hbtn{display:inline-flex;align-items:center;gap:6px}
.hbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:square;flex-shrink:0}
.hbtn .x{display:none}#muteBtn[aria-pressed="true"] .x{display:inline}#muteBtn[aria-pressed="true"] .w{display:none}
.hbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
#stats{width:100%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.stat{display:flex;flex-direction:column;gap:3px;font-size:12px}
.stat i{display:block;height:9px;background:var(--paper);border:2px solid var(--ink)}
.stat b{display:block;height:100%;transition:width .4s}
.stat.pulse i{animation:pulse .7s steps(2) 2}
@keyframes pulse{50%{background:var(--sun)}}
.chapcard{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);padding:3cqw 4cqw;background:var(--ink);color:#fff;text-align:center;font-size:max(15px,5.4cqw);font-weight:700;z-index:7;pointer-events:none;animation:chap 1.8s forwards}
@keyframes chap{0%{opacity:0}12%,72%{opacity:1}100%{opacity:0}}
#screen{position:relative;width:100%;aspect-ratio:3/2;border:4px solid var(--ink);background:var(--ink);overflow:hidden;container-type:inline-size}
#game{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#ui{position:absolute;inset:0;font-size:max(12px,3.4cqw);pointer-events:none}
#ui>*{pointer-events:auto}
#toasts{position:absolute;top:2cqw;right:2cqw;display:flex;flex-direction:column;gap:1cqw;align-items:flex-end;pointer-events:none;z-index:6}
.toast{background:var(--ink);color:#fff;padding:.8cqw 2.2cqw;font-size:max(11px,2.6cqw);border:.4cqw solid #fff;white-space:nowrap;animation:toast 1.9s forwards}
@keyframes toast{0%{opacity:0;transform:translateY(-1cqw)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#fade{position:absolute;inset:0;background:var(--ink);opacity:0;pointer-events:none;transition:opacity .3s;z-index:8}
#fade.on{opacity:1}
#np{position:absolute;left:1.6cqw;top:1.6cqw;max-width:56cqw;background:rgba(35,29,51,.72);color:#fff;font-size:max(10px,2.5cqw);line-height:1.2;padding:.6cqw 1.4cqw;border-radius:1cqw;pointer-events:none;z-index:5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dialog{position:absolute;left:2.5cqw;right:2.5cqw;bottom:2.5cqw;min-height:15cqw;padding:3.6cqw 4.5cqw 3cqw;background:var(--paper);border:.7cqw solid var(--ink);box-shadow:.9cqw .9cqw 0 var(--ink);line-height:1.35}
.dialog p{margin:0}
.dialog .tag{position:absolute;left:3cqw;top:-3.8cqw;padding:.3cqw 1.8cqw;background:var(--sun);border:.6cqw solid var(--ink);font-weight:700;font-size:max(11px,3cqw)}
.dialog .more{position:absolute;right:2.4cqw;bottom:1.8cqw;width:0;height:0;border-left:1.2cqw solid transparent;border-right:1.2cqw solid transparent;border-top:1.4cqw solid var(--ink);animation:bob .6s steps(2) infinite}
.dialog.paulo{background:#eaf1ff;border-color:#3d5a9e;box-shadow:.9cqw .9cqw 0 #3d5a9e}
.dialog.paulo .tag{background:#9fc0ff;border-color:#3d5a9e}
.dialog.paulo .more{border-top-color:#3d5a9e}
@keyframes bob{50%{transform:translateY(.6cqw)}}
.panel{position:absolute;inset:0 6cqw;margin:auto 0;height:-webkit-fit-content;height:fit-content;max-height:calc(100% - 8cqw);background:var(--paper);border:.7cqw solid var(--ink);box-shadow:.9cqw .9cqw 0 var(--ink);padding:3cqw 3.5cqw;display:flex;flex-direction:column;gap:1.8cqw;overflow:auto}
.panel h2{margin:0;font-size:5cqw;line-height:1}
.panel p{margin:0}
.sub{font-family:Figtree,sans-serif;font-size:max(11px,2.6cqw);color:var(--muted)}
.opt{font:inherit;font-size:max(12px,3.2cqw);text-align:left;background:var(--paper);color:var(--ink);border:.55cqw solid var(--ink);padding:1.2cqw 2cqw;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:.3cqw;min-height:7.5cqw}
.opt small{font-family:Figtree,sans-serif;font-size:max(10.5px,2.3cqw);color:var(--muted)}
.opt.on{background:#fff0f4;border-color:var(--pinkd);box-shadow:.6cqw .6cqw 0 var(--pinkd)}
.opt.done{background:#e3f6ea;border-color:#2f7a52;color:#2f7a52;box-shadow:none}
.opt:disabled{cursor:default}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.4cqw}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.4cqw}
.grid3 .opt{align-items:center;text-align:center;min-height:10cqw}
.wr{display:flex;gap:3cqw;align-items:stretch;flex:1;min-height:0}
.prev{width:18cqw;height:auto;aspect-ratio:16/20;image-rendering:pixelated;background:#f6dbe6;border:.6cqw solid var(--ink);align-self:center;padding:1cqw}
.wr .col{flex:1;display:flex;flex-direction:column;gap:1.2cqw}
.bar{position:relative;height:7cqw;background:#e5e9f0;border:.6cqw solid var(--ink)}
.zone{position:absolute;top:0;bottom:0;background:var(--shell)}
.zone::after{content:'';position:absolute;inset:0 30%;background:var(--pink)}
.mark{position:absolute;top:-1.6cqw;bottom:-1.6cqw;width:1.2cqw;background:var(--ink);transform:translateX(-50%)}
.reps{display:flex;gap:1.4cqw}
.rep{width:4.4cqw;height:4.4cqw;border:.5cqw solid var(--ink);background:var(--paper)}
.rep.perfect{background:var(--pink)}.rep.good{background:var(--sun)}.rep.miss{background:#9aa3b2}
.result{font-size:4.6cqw;min-height:5.6cqw;font-weight:700}
.item{display:flex;align-items:center;gap:2.4cqw;font-size:5cqw;font-weight:700;padding:1.4cqw 0}
.item i{width:6cqw;height:6cqw;border:.5cqw solid var(--ink);display:block}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-1cqw)}75%{transform:translateX(1cqw)}}
.titlecard{position:absolute;left:5cqw;top:5cqw;width:58cqw;padding:3cqw 3.6cqw;background:var(--paper);border:.7cqw solid var(--ink);box-shadow:1cqw 1cqw 0 var(--ink);display:flex;flex-direction:column;gap:1.2cqw}
.titlecard h1{margin:0;font-size:7cqw;line-height:1;color:var(--pinkd)}
.titlecard p{margin:0;font-family:Figtree,sans-serif;font-size:max(11px,2.6cqw);color:var(--muted)}
.start{position:absolute;left:8cqw;bottom:6cqw;font-size:max(13px,4cqw);padding:1.2cqw 4cqw;align-items:center;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{box-shadow:none;transform:translate(.4cqw,.4cqw)}}
.titlecard .keys{font-size:max(10.5px,2.3cqw);color:var(--ink);opacity:.8}
.radio{position:absolute;left:3.3cqw;right:3.3cqw;top:6.4cqw;display:flex;align-items:center;gap:1.6cqw;background:var(--paper);border:.5cqw solid var(--ink);box-shadow:.6cqw .6cqw 0 var(--ink);padding:.6cqw 1cqw;font-size:max(10.5px,2.5cqw);white-space:nowrap}
.radio .rs{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.radio .rl{background:var(--ink);color:#fff;padding:.2cqw 1cqw}
.radio .opt{min-height:0;padding:.4cqw 1.4cqw;font-size:max(10.5px,2.4cqw);flex-shrink:0}
.hint{position:absolute;left:8cqw;right:8cqw;top:15cqw;text-align:center;color:#fff;background:rgba(35,29,51,.86);padding:.8cqw 2cqw;font-size:max(11px,2.7cqw);line-height:1.3;animation:hintout 5s forwards;pointer-events:none}
@keyframes hintout{0%,75%{opacity:1}100%{opacity:0}}
.bbox{position:absolute;background:var(--paper);border:.6cqw solid var(--ink);box-shadow:.8cqw .8cqw 0 var(--ink);padding:1.4cqw 2cqw;display:flex;flex-direction:column;gap:.9cqw;font-size:3.2cqw}
.ebox{left:3cqw;top:3cqw;width:44cqw}
.pbox{right:3cqw;top:22cqw;width:44cqw;gap:.6cqw}
.bn{display:flex;justify-content:space-between;font-weight:700}
.hp{display:flex;align-items:center;gap:1.2cqw;font-size:max(10px,2.3cqw);font-family:Figtree,sans-serif;font-weight:700}
.hp em{font-style:normal;width:5cqw}
.hp i{flex:1;height:1.9cqw;border:.4cqw solid var(--ink);background:#d7dce6;display:block}
.hp b{display:block;height:100%;background:#3fae7c;transition:width .4s}
.bpanel{position:absolute;left:0;right:0;bottom:0;height:26cqw;background:var(--ink);display:flex;gap:1.4cqw;padding:1.4cqw}
.bmsg{flex:1;border:.5cqw solid #fff;color:#fff;padding:1.6cqw 2.4cqw;font-size:max(12px,3.1cqw);line-height:1.3;font-family:Figtree,sans-serif}
.bmoves{flex:1.35;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1cqw;background:var(--paper);padding:1cqw}
.bpanel.picking .bmsg{display:none}
.bmoves .opt{min-height:0;padding:.5cqw 1.6cqw;font-size:max(11px,2.8cqw);line-height:1.05;gap:.3cqw;font-family:Figtree,sans-serif;overflow:hidden}
.bmoves .opt span{font-weight:700}
.bmoves .opt small{font-size:max(10px,2.2cqw);line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

}

  const t = actx.currentTime;
  const seq = (ms, gap, d, type, v) => ms.forEach((m, i) => note(m, t + i * gap, d, type, v));
  const S = {
    blip: () => note(84, t, .05, 'square', .04),
    select: () => seq([79, 86], .05, .07, 'square', .05),
    good: () => seq([76, 83], .07, .1, 'square', .05),
    bad: () => note(45, t, .2, 'sawtooth', .05),
    pickup: () => seq([76, 80, 83, 88], .05, .08, 'square', .05),
    badge: () => seq([72, 76, 79, 84, 79, 84], .09, .12, 'square', .05),
    hit: () => { note(40, t, .12, 'sawtooth', .07); note(33, t + .05, .15, 'square', .05); },
    pr: () => seq([67, 72, 76, 79, 84, 88], .08, .14, 'square', .06),
    woof: () => { note(55, t, .08, 'sawtooth', .06); note(50, t + .1, .1, 'sawtooth', .06); },
    talk: () => note(70 + Math.floor(Math.random() * 6), t, .03, 'square', .015),
    battle: () => seq([60, 63, 67, 72, 60, 63, 67, 72], .06, .08, 'square', .05),

}

function updateFinale(dt) {
  G.fxT -= dt;
  if (G.fxT <= 0) {
    G.fxT = 0.5 + Math.random() * 0.4;
    const cx = 30 + Math.random() * 180, cy = 20 + Math.random() * 40, col = ['#ff6f91', '#ffd166', '#7fc8f8', '#ffffff', '#b9e1d6'][Math.floor(Math.random() * 5)];

    case 'botanist:r': box(0, 0, W, H - 2, '#5a3620'); R(X + 1, Y + 1, W - 2, 3, '#b07a4a'); R(X + 1, Y + H - 5, W - 2, 1, '#e0b35a'); for (let i = 4; i < W - 4; i += 11) { R(X + i, Y - 5, 3, 6, ['#3fae7c', '#8e1f3a', '#ffd166'][(i / 11 | 0) % 3]); R(X + i + 1, Y - 7, 1, 2, INK); R(X + i + 6, Y - 2, 3, 3, '#dff3ff'); } break;
    case 'botanist:t': R(X + 3, Y + H - 2, W - 6, 2, 'rgba(35,29,51,.3)'); box(1, 1, W - 2, H - 3, '#5a3620'); R(X + 2, Y + 2, W - 4, 2, '#8a5a3b'); R(X + W / 2 - 1, Y - 1, 2, 4, '#fff5d6'); R(X + W / 2 - 1, Y - 3, 2, 2, '#ff9f43'); R(X + 5, Y + 5, 3, 4, '#dff3ff'); R(X + W - 8, Y + 5, 3, 4, '#8e1f3a'); break;
    case 'beach:J': drawSpr(sprite('corolla'), X + 4, Y + 3, false); break;
    case 'beach:u': R(X + 7, Y - 6, 2, 20, '#8a5a3b'); box(-2, -13, 20, 8, '#ff5c7a'); R(X + 3, Y - 12, 3, 6, '#ffffff'); R(X + 10, Y - 12, 3, 6, '#ffffff'); break;
    case 'beach:p': R(X + 6, Y - 10, 4, 25, '#8a5a3b'); for (let i = -8; i < 14; i += 5) R(X + 6, Y + i, 4, 1, '#6b4228'); R(X - 4, Y - 14, 24, 4, '#3fae7c'); R(X, Y - 18, 16, 4, '#2f8f63'); R(X - 3, Y - 10, 6, 3, '#3fae7c'); R(X + 13, Y - 10, 6, 3, '#3fae7c'); break;
    case 'beach:s': box(5, 7, 7, 5, '#ff9fb8'); R(X + 7, Y + 8, 1, 3, '#e27a98'); R(X + 9, Y + 8, 1, 3, '#e27a98'); break;
  }
}
function renderMap() {
  const th = G.map.def.theme, tiles = G.map.tiles, wo = WALLOBJ[th] || '', ob = OBJ[th] || '';
  for (let ty = 0; ty < tiles.length; ty++) for (let tx = 0; tx < tiles[0].length; tx++) {
    const c = tiles[ty][tx], X = tx * 16, Y = ty * 16;
    if (c === '#' || wo.includes(c)) drawWall(th, X, Y, tx, ty, tiles);
    else if (c === '~') { R(X, Y, 16, 16, '#4fa9e3'); R(X + ((tx * 5 + Math.floor(G.t * 6)) % 16) - 2, Y + 4 + (ty % 2) * 6, 6, 1, '#bfe3ff'); R(X + ((tx * 9 + Math.floor(G.t * 4)) % 16) - 2, Y + 11 - (ty % 2) * 6, 4, 1, '#8dcaf0'); }
    else if (c === '_') { R(X, Y, 16, 16, '#e9cf8f'); const f = Math.floor(G.t * 3 + tx) % 3; R(X, Y, 16, 2, '#ffffff'); R(X + 2 + f * 3, Y + 2, 5, 1, '#ffffff'); }
    else if (c === 'D') { drawFloor(th, X, Y, tx, ty); R(X + 1, Y + 2, 14, 12, INK); R(X + 2, Y + 3, 12, 10, '#7fa383'); R(X + 4, Y + 5, 8, 1, '#5c7d60'); R(X + 4, Y + 9, 8, 1, '#5c7d60'); }
    else drawFloor(th, X, Y, tx, ty);
  }
  for (let ty = 0; ty < tiles.length; ty++) for (let tx = 0; tx < tiles[0].length; tx++) {
    const c = tiles[ty][tx];
    if (ob.includes(c) && isOrigin(tiles, tx, ty, c)) { const [W, H] = extent(tiles, tx, ty, c); drawObject(th, c, tx * 16, ty * 16, W, H); }
  }
  // entities
  const ents = [];
  const def = G.map.def;
  for (let ty = 0; ty < tiles.length; ty++) for (let tx = 0; tx < tiles[0].length; tx++) {
    const c = tiles[ty][tx];
    const n = def.npc && def.npc(c, tx, ty);
    if (n) ents.push({ y: ty * 16, d: () => { R(tx * 16 + 3, ty * 16 + 14, 10, 2, 'rgba(35,29,51,.22)'); drawSpr(sprite(n[0], n[1]), tx * 16, ty * 16 - 4, false); } });
    if (c === 'h') ents.push({ y: ty * 16, d: () => drawSpr(sprite('heart'), tx * 16 + 4, ty * 16 + 5 + Math.round(Math.sin(G.t * 4 + tx) * 1.5), false) });
    if (c === 'q') ents.push({ y: ty * 16, d: () => drawSpr(sprite('cake'), tx * 16 + 1, ty * 16 + 3, false) });
  }
  const p = G.p, l = G.l;
  const pb = p.mv ? (Math.floor(p.mv.t * 4) % 2) : 0;
  if (l) ents.push({ y: l.py, d: () => { R(l.px + 3, l.py + 14, 10, 2, 'rgba(35,29,51,.22)'); drawSpr(lucaSpr(!!l.mv, l.mv ? l.mv.t : null), l.px, l.py + 1, l.flip); } });
  ents.push({ y: p.py + 0.5, d: () => { R(p.px + 3, p.py + 14, 10, 2, 'rgba(35,29,51,.22)'); drawSpr(annetteSprite(p.dir === 'up'), p.px, p.py - 4 - pb, false); } });
  ents.sort((a, b) => a.y - b.y).forEach(e => e.d());
  // objective markers
  const hs = (def.hints ? def.hints() : []).filter(Boolean);
  hs.forEach(c => {
    for (let ty = 0; ty < tiles.length; ty++) for (let tx = 0; tx < tiles[0].length; tx++) {
      if (tiles[ty][tx] !== c || !isOrigin(tiles, tx, ty, c)) continue;
      const [W] = ob.includes(c) ? extent(tiles, tx, ty, c) : [16];
      const x = tx * 16 + W / 2 - 4, y = Math.max(1, ty * 16 - 20) + Math.round(Math.sin(G.t * 5) * 2);
      R(x, y, 8, 10, INK); R(x + 1, y + 1, 6, 8, '#ffd166'); R(x + 3, y + 2, 2, 4, INK); R(x + 3, y + 7, 2, 1, INK);
    }
  });
  // secret-item markers: a pink "?" bubble so secrets are easy to find
  const secretsHere = ({ bedroom: [['o', 'owl'], ['k', 'book']], gym: [['L', 'card']], botanist: [['F', 'poster']] })[G.mapId] || [];
  secretsHere.forEach(([c, id]) => {
    if (G.secrets[id]) return;
    for (let ty = 0; ty < tiles.length; ty++) for (let tx = 0; tx < tiles[0].length; tx++) {
      if (tiles[ty][tx] !== c || !isOrigin(tiles, tx, ty, c)) continue;
      const [W] = (ob.includes(c) || wo.includes(c)) ? extent(tiles, tx, ty, c) : [16];
      const x = tx * 16 + W / 2 - 4, y = Math.max(1, ty * 16 - 20) + Math.round(Math.sin(G.t * 5 + 1.5) * 2);
      R(x - 1, y - 1, 10, 12, INK); R(x, y, 8, 10, '#ff6f91');
      R(x + 2, y + 1, 4, 1, '#fff'); R(x + 5, y + 2, 1, 2, '#fff'); R(x + 3, y + 4, 2, 1, '#fff'); R(x + 3, y + 6, 1, 1, '#fff'); R(x + 3, y + 8, 1, 1, '#fff');
    }
  });
}
function renderBeachScene(sunset) {
  R(0, 0, 240, 72, sunset ? '#ffb38a' : '#bfe3ff');
  if (sunset) { R(0, 0, 240, 22, '#f08a8a'); R(0, 22, 240, 20, '#ff9f8a'); }
  oval(sunset ? 120 : 196, sunset ? 74 : 26, 18, 18, '#ffd166', INK);
  R(0, 72, 240, 30, sunset ? '#4f7fc4' : '#4fa9e3');
  for (let i = 0; i < 8; i++) R(((i * 37 + G.t * 12) % 260) - 20, 78 + (i % 3) * 7, 10, 1, sunset ? '#ffb38a' : '#bfe3ff');
  R(0, 100, 240, 3, '#ffffff'); R(0, 103, 240, 57, '#f6dfa6');
  for (let i = 0; i < 40; i++) R(Math.floor(hsh(i, 1, 2) * 240), 106 + Math.floor(hsh(i, 2, 3) * 52), 1, 1, '#e3c47f');
}
function renderTitle() {
  const cols = ['#ff6f91', '#ffd166', '#7fc8f8', '#3fae7c', '#c9b6f2'];
  // party room: wall + floor
  R(0, 0, 240, 116, '#ffd9e6'); R(0, 0, 240, 44, '#ffcfe0');
  R(0, 116, 240, 44, '#c9a27a'); R(0, 116, 240, 3, '#8a5a3b');
  for (let y = 123; y < 160; y += 8) R(0, y, 240, 1, '#b78e63');
  // party rug the crew stands on
  R(50, 120, 150, 32, '#ff9fb8'); R(50, 120, 150, 2, '#e27a98');
  // bunting swag with pennants
  ctx.strokeStyle = '#c98aa0'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, 6); ctx.quadraticCurveTo(120, 26, 240, 6); ctx.stroke();
  for (let i = 0; i < 19; i++) { const x = 4 + i * 13, y = 6 + Math.sin(Math.PI * x / 240) * 12, c = cols[i % cols.length]; ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(x - 4, y); ctx.lineTo(x + 4, y); ctx.lineTo(x, y + 7); ctx.closePath(); ctx.fill(); }
  // balloons
  const bal = (x, y, c) => { oval(x, y, 7, 9, c, INK); R(x, y + 9, 1, 7, '#c98aa0'); R(x - 1, y + 8, 3, 2, c); };
  bal(206, 48, '#ff6f91'); bal(223, 58, '#ffd166'); bal(20, 72, '#7fc8f8');
  // confetti falling
  for (let i = 0; i < 44; i++) { const x = Math.floor((hsh(i, 1, 2) * 240 + G.t * 16 * (0.4 + hsh(i, 3, 4))) % 240); const y = Math.floor((hsh(i, 2, 3) * 114 + G.t * 26 * (0.4 + hsh(i, 4, 5))) % 114); R(x, y, 2, 2, cols[i % cols.length]); }
  // floating hearts
  drawSpr(sprite('heart'), 150, 90 + Math.round(Math.sin(G.t * 3) * 2), false, 1);
  drawSpr(sprite('heart'), 198, 100 + Math.round(Math.sin(G.t * 3 + 1) * 2), false, 1);
  // the crew: Mum, Annette (birthday girl), Paulo, Luca
  drawSpr(sprite('mum'), 60, 104, false, 2);
  drawSpr(annetteSprite(false, 'dress'), 100, 102, false, 2);
  drawSpr(sprite('paulo'), 140, 104, false, 2);
  drawSpr(lucaSpr(), 190, 116, true, 2);
}
function renderFinale() {
  R(0, 0, 240, 30, '#141a3a'); R(0, 30, 240, 30, '#1c2346'); R(0, 60, 240, 30, '#28305c');
  for (let i = 0; i < 30; i++) if ((Math.floor(G.t * 2) + i) % 7) R(Math.floor(hsh(i, 9, 1) * 240), Math.floor(hsh(i, 8, 2) * 70), 1, 1, '#e9f3ff');
  G.fx.forEach(p => R(p.x, p.y, 2, 2, p.c));
  // harbour water
  R(0, 96, 240, 20, '#27335e');
  for (let i = 0; i < 16; i++) R(((i * 29 + G.t * 8) % 250) - 10, 100 + (i % 4) * 4, 8, 1, ['#ffd166', '#ff6f91', '#7fc8f8'][i % 3]);
  // Sydney Harbour Bridge - prominent lit silhouette (the coathanger)
  const bx = 120, by = 100, span = 104, R2 = span - 8;
  R(bx - span, by, span * 2, 5, '#39466e');            // deck
  R(bx - span, by, span * 2, 1, '#5a6a9c');
  R(bx - span + 3, by - 16, 9, 21, '#46527d'); R(bx + span - 12, by - 16, 9, 21, '#46527d'); // pylons
  R(bx - span + 3, by - 16, 9, 3, '#6b78a8'); R(bx + span - 12, by - 16, 9, 3, '#6b78a8');
  const archY = x => by - Math.round(Math.sqrt(Math.max(0, R2 * R2 - (x - bx) * (x - bx))) * 0.52);
  ctx.strokeStyle = '#55628e'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(bx, by + 46, R2, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
  ctx.strokeStyle = '#6c7aa8'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(bx, by + 46, R2 - 3, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
  for (let x = bx - span + 16; x < bx + span - 14; x += 8) { const ay = archY(x); R(x, ay, 1, by - ay, '#46527d'); R(x, ay - 1, 1, 1, '#ffd166'); } // hangers + arch lights
  for (let x = bx - span; x < bx + span; x += 7) R(x, by - 1, 1, 1, '#ffe9a8'); // deck lights
  // deck, fairy lights, table
  R(0, 116, 240, 44, '#6b4228'); for (let y = 120; y < 160; y += 6) R(0, y, 240, 1, '#5a3620');
  R(0, 112, 240, 4, '#2f5d4a');
  ctx.strokeStyle = '#3a3040'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, 6); ctx.quadraticCurveTo(120, 34, 240, 6); ctx.stroke();
  for (let i = 0; i < 16; i++) { const x = 8 + i * 15, y = 6 + Math.sin(Math.PI * x / 240) * 14; R(x, y, 2, 2, (Math.floor(G.t * 3) + i) % 4 ? '#ffd166' : '#fff5d6'); }
  R(150, 128, 40, 4, INK); R(151, 129, 38, 2, '#ffffff'); R(168, 132, 4, 16, INK);
  drawSpr(sprite('cake'), 163, 114, false, 1);
  R(154, 121, 3, 7, '#ffd166'); R(154, 119, 3, 2, '#ffffff'); R(184, 121, 3, 5, '#8e1f3a'); R(185, 126, 1, 2, INK);
  drawSpr(annetteSprite(false, 'dress'), 70, 108, false, 2);
  drawSpr(sprite('paulo'), 108, 108, false, 2);
  drawSpr(sprite('heart'), 99, 94 + Math.round(Math.sin(G.t * 3) * 2), false, 2);
}

/* ---------------- loop ---------------- */
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; G.t += dt;
  if (G.dlg) {
    const d = G.dlg, line = d.lines[d.i];
    if (d.shown < line.t.length) {
      const prev = Math.floor(d.shown); d.shown = Math.min(line.t.length, d.shown + dt * 55);
      const n = Math.floor(d.shown);
      if (n !== prev) { d.p.textContent = line.t.slice(0, n); if (n % 3 === 0) sfx('talk'); }
      if (d.shown >= line.t.length) d.more.hidden = false;
    }
  }
  if (G.scene === 'map') updateMap(dt);
  else if (G.scene === 'drive') updateDrive(dt);
  else if (G.scene === 'finale' || G.scene === 'credits') updateFinale(dt);
  if (G.mode === 'lift') updateLift(dt);
  nowPlaying();
  ctx.clearRect(0, 0, 240, 160);
  if (G.scene === 'title') renderTitle();
  else if (G.scene === 'map') renderMap();
  else if (G.scene === 'drive') renderDrive();
  else if (G.scene === 'lunch') renderLunch();
  else if (G.scene === 'battle') renderBattle();
  else if (G.scene === 'finale' || G.scene === 'credits') renderFinale();
  requestAnimationFrame(loop);
}

/* ---------------- title ---------------- */
function showTitle() {
  G.scene = 'title'; clearUI(); setChapter(CONFIG.name + "'s Big Day");
  ui.append(el('div', 'titlecard', '<h1>' + esc(CONFIG.name) + "'s Big Day</h1><p>A birthday adventure across one sunny Sydney day</p><p class='keys'>Arrows to move · A to interact · B for your collection</p>"));
  const b = makeBtn('Press start', () => fade(() => loadMap('bedroom'))); b.classList.add('start');
  ui.append(b); setMenu([b]); music('title');
}
showTitle();
requestAnimationFrame(loop);
</script>
