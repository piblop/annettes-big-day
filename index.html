<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Annette's Big Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Figtree:wght@400;600;700&display=swap">
<style>
:root{--ink:#231d33;--paper:#ffffff;--pink:#ff6f91;--pinkd:#d6336c;--shell:#ff9fb8;--sky:#e9f3ff;--sun:#ffd166;--muted:#4d4764}
*{box-sizing:border-box}
html,body{margin:0;background:var(--sky);color:var(--ink);touch-action:manipulation}
body{min-height:100vh;display:flex;justify-content:center;font-family:'Pixelify Sans',ui-monospace,monospace;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#app{width:min(100%,780px);padding:14px;display:flex;flex-direction:column;gap:14px}
.shell{background:var(--shell);border:4px solid var(--ink);border-radius:22px 22px 56px 22px;padding:14px;box-shadow:8px 8px 0 var(--ink);display:flex;flex-direction:column;gap:12px}
#hud{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
#chapter{font-size:clamp(15px,3.2vw,22px);font-weight:700}
#hudBtns{display:flex;gap:8px}
.hbtn{font:inherit;font-size:14px;padding:6px 12px;min-height:36px;background:var(--paper);border:3px solid var(--ink);color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.hbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
#stats{width:100%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.stat{display:flex;flex-direction:column;gap:3px;font-size:12px}
.stat i{display:block;height:9px;background:var(--paper);border:2px solid var(--ink)}
.stat b{display:block;height:100%;transition:width .4s}
#screen{position:relative;width:100%;aspect-ratio:3/2;border:4px solid var(--ink);background:var(--ink);overflow:hidden;container-type:inline-size}
#game{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#ui{position:absolute;inset:0;font-size:3.4cqw;pointer-events:none}
#ui>*{pointer-events:auto}
#toasts{position:absolute;top:2cqw;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:1cqw;align-items:center;pointer-events:none;z-index:6}
.toast{background:var(--ink);color:#fff;padding:.8cqw 2.2cqw;font-size:2.8cqw;white-space:nowrap;animation:toast 1.9s forwards}
@keyframes toast{0%{opacity:0;transform:translateY(-1cqw)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#fade{position:absolute;inset:0;background:var(--ink);opacity:0;pointer-events:none;transition:opacity .3s;z-index:8}
#fade.on{opacity:1}
#np{position:absolute;left:1.6cqw;top:1.6cqw;max-width:56cqw;background:rgba(35,29,51,.72);color:#fff;font-size:2.5cqw;line-height:1.2;padding:.6cqw 1.4cqw;border-radius:1cqw;pointer-events:none;z-index:5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dialog{position:absolute;left:2.5cqw;right:2.5cqw;bottom:2.5cqw;min-height:15cqw;padding:3.6cqw 4.5cqw 3cqw;background:var(--paper);border:.7cqw solid var(--ink);box-shadow:.9cqw .9cqw 0 var(--ink);line-height:1.35}
.dialog p{margin:0}
.dialog .tag{position:absolute;left:3cqw;top:-3.8cqw;padding:.3cqw 1.8cqw;background:var(--sun);border:.6cqw solid var(--ink);font-weight:700;font-size:3cqw}
.dialog .more{position:absolute;right:2.4cqw;bottom:1.8cqw;width:0;height:0;border-left:1.2cqw solid transparent;border-right:1.2cqw solid transparent;border-top:1.4cqw solid var(--ink);animation:bob .6s steps(2) infinite}
.dialog.paulo{background:#eaf1ff;border-color:#3d5a9e;box-shadow:.9cqw .9cqw 0 #3d5a9e}
.dialog.paulo .tag{background:#9fc0ff;border-color:#3d5a9e}
.dialog.paulo .more{border-top-color:#3d5a9e}
@keyframes bob{50%{transform:translateY(.6cqw)}}
.panel{position:absolute;inset:4cqw 6cqw;background:var(--paper);border:.7cqw solid var(--ink);box-shadow:.9cqw .9cqw 0 var(--ink);padding:3cqw 3.5cqw;display:flex;flex-direction:column;gap:1.8cqw;overflow:auto}
.panel h2{margin:0;font-size:5cqw;line-height:1}
.panel p{margin:0}
.sub{font-family:Figtree,sans-serif;font-size:2.6cqw;color:var(--muted)}
.opt{font:inherit;font-size:3.2cqw;text-align:left;background:var(--paper);color:var(--ink);border:.55cqw solid var(--ink);padding:1.2cqw 2cqw;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:.3cqw;min-height:7.5cqw}
.opt small{font-family:Figtree,sans-serif;font-size:2.3cqw;color:var(--muted)}
.opt.on{background:#fff0f4;border-color:var(--pinkd);box-shadow:.6cqw .6cqw 0 var(--pinkd)}
.opt.done{background:#e3f6ea;border-color:#2f7a52;color:#2f7a52;box-shadow:none}
.opt:disabled{cursor:default}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.4cqw}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.4cqw}
.wr{display:flex;gap:3cqw;align-items:stretch;flex:1;min-height:0}
.prev{width:18cqw;height:auto;aspect-ratio:16/20;image-rendering:pixelated;background:#f6dbe6;border:.6cqw solid var(--ink);align-self:center;padding:1cqw}
.wr .col{flex:1;display:flex;flex-direction:column;gap:1.2cqw}
.bar{position:relative;height:7cqw;background:#e5e9f0;border:.6cqw solid var(--ink)}
.zone{position:absolute;top:0;bottom:0;background:var(--shell)}
.zone::after{content:'';position:absolute;inset:0 30%;background:var(--pink)}
.mark{position:absolute;top:-1.6cqw;bottom:-1.6cqw;width:1.2cqw;background:var(--ink);transform:translateX(-50%)}
.reps{display:flex;gap:1.4cqw}
.rep{width:4.4cqw;height:4.4cqw;border:.5cqw solid var(--ink);background:var(--paper)}
.rep.perfect{background:var(--pink)}.rep.good{background:var(--sun)}.rep.miss{background:#9aa3b2}
.result{font-size:4.6cqw;min-height:5.6cqw;font-weight:700}
.item{display:flex;align-items:center;gap:2.4cqw;font-size:5cqw;font-weight:700;padding:1.4cqw 0}
.item i{width:6cqw;height:6cqw;border:.5cqw solid var(--ink);display:block}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-1cqw)}75%{transform:translateX(1cqw)}}
.titlecard{position:absolute;left:5cqw;top:5cqw;width:58cqw;padding:3cqw 3.6cqw;background:var(--paper);border:.7cqw solid var(--ink);box-shadow:1cqw 1cqw 0 var(--ink);display:flex;flex-direction:column;gap:1.2cqw}
.titlecard h1{margin:0;font-size:7cqw;line-height:1;color:var(--pinkd)}
.titlecard p{margin:0;font-family:Figtree,sans-serif;font-size:2.6cqw;color:var(--muted)}
.start{position:absolute;left:50%;bottom:4cqw;transform:translateX(-50%);font-size:4cqw;padding:1.2cqw 4cqw;align-items:center}
.howto{position:absolute;right:2cqw;top:2cqw;margin:0;width:30cqw;font-family:Figtree,sans-serif;font-size:2.2cqw;background:rgba(255,255,255,.85);border:.4cqw solid var(--ink);padding:1cqw 1.4cqw}
.radio{position:absolute;left:2.5cqw;top:6.5cqw;display:flex;align-items:center;gap:1.6cqw;background:var(--paper);border:.6cqw solid var(--ink);box-shadow:.7cqw .7cqw 0 var(--ink);padding:1cqw 1.6cqw;font-size:2.8cqw}
.radio .rl{background:var(--ink);color:#fff;padding:.2cqw 1cqw}
.radio .opt{min-height:0;padding:.6cqw 1.4cqw;font-size:2.5cqw}
.hint{position:absolute;left:0;right:0;bottom:1.4cqw;text-align:center;color:#fff;font-size:2.7cqw;text-shadow:.3cqw .3cqw 0 var(--ink)}
.bbox{position:absolute;background:var(--paper);border:.6cqw solid var(--ink);box-shadow:.8cqw .8cqw 0 var(--ink);padding:1.4cqw 2cqw;display:flex;flex-direction:column;gap:.9cqw;font-size:3.2cqw}
.ebox{left:3cqw;top:3cqw;width:44cqw}
.pbox{right:3cqw;top:27cqw;width:44cqw}
.bn{display:flex;justify-content:space-between;font-weight:700}
.hp{display:flex;align-items:center;gap:1.2cqw;font-size:2.3cqw;font-family:Figtree,sans-serif;font-weight:700}
.hp em{font-style:normal;width:5cqw}
.hp i{flex:1;height:1.9cqw;border:.4cqw solid var(--ink);background:#d7dce6;display:block}
.hp b{display:block;height:100%;background:#3fae7c;transition:width .4s}
.bpanel{position:absolute;left:0;right:0;bottom:0;height:30cqw;background:var(--ink);display:flex;gap:1.4cqw;padding:1.4cqw}
.bmsg{flex:1;border:.5cqw solid #fff;color:#fff;padding:1.6cqw 2.4cqw;font-size:3.1cqw;line-height:1.3;font-family:Figtree,sans-serif}
.bmoves{flex:1.35;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1cqw;background:var(--paper);padding:1cqw}
.bmoves .opt{min-height:0;padding:.5cqw 1cqw;font-size:2.3cqw;line-height:1.08;gap:.2cqw;font-family:Figtree,sans-serif;overflow:hidden}
.bmoves .opt span{font-weight:700}
.bmoves .opt small{font-size:1.8cqw;line-height:1.05}
.big{position:absolute;left:0;right:0;top:5cqw;text-align:center;font-size:8.4cqw;line-height:1;font-weight:700;color:#fff;text-shadow:.7cqw .7cqw 0 var(--ink);padding:0 4cqw}
.finbtn{position:absolute;left:50%;top:23cqw;transform:translateX(-50%);align-items:center}
.credits{position:absolute;inset:0;background:var(--ink);color:#fff;overflow:hidden;text-align:center}
.roll{position:absolute;left:0;right:0;top:100%;display:flex;flex-direction:column;gap:1.6cqw;font-size:3.6cqw;animation:roll 26s linear forwards}
.roll h3{margin:3cqw 0 0;color:var(--sun);font-size:4.4cqw}
.roll p{margin:0}
@keyframes roll{to{transform:translateY(calc(-100% - 72cqw))}}
.credits .opt{position:absolute;right:3cqw;bottom:3cqw}
.badges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.4cqw}
.badge{border:.5cqw solid var(--ink);padding:1.2cqw 1.6cqw;display:flex;flex-direction:column;gap:.3cqw}
.badge.got{background:#fff0f4;border-color:var(--pinkd)}
.badge b{font-size:3.2cqw}
.badge span{font-family:Figtree,sans-serif;font-size:2.3cqw;color:var(--muted)}
.counts{display:flex;gap:3cqw;font-size:3cqw}
#pad{display:flex;justify-content:space-between;align-items:center;padding:4px 8px 6px;user-select:none;-webkit-user-select:none}
#dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px)}
#dpad button{font-size:18px;background:var(--ink);color:#fff;border:none;cursor:pointer;touch-action:none}
#dpad button:active,#dpad button.held{background:#4d4764}
#dpad .u{grid-column:2;grid-row:1;border-radius:8px 8px 0 0}
#dpad .l{grid-column:1;grid-row:2;border-radius:8px 0 0 8px}
#dpad .c{grid-column:2;grid-row:2;background:var(--ink)}
#dpad .r{grid-column:3;grid-row:2;border-radius:0 8px 8px 0}
#dpad .d{grid-column:2;grid-row:3;border-radius:0 0 8px 8px}
#ab{display:flex;gap:16px;align-items:center;transform:rotate(-14deg)}
.round{width:66px;height:66px;border-radius:50%;border:4px solid var(--ink);font:inherit;font-size:24px;font-weight:700;cursor:pointer;box-shadow:3px 3px 0 var(--ink);touch-action:none}
#aBtn{background:var(--pink);color:var(--ink);margin-top:-26px}
#bBtn{background:var(--paper);color:var(--ink)}
.round:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.help{margin:0;text-align:center;font-family:Figtree,sans-serif;font-size:13px;color:var(--muted)}
button:focus-visible{outline:3px solid #3d7be0;outline-offset:3px}
@media (prefers-reduced-motion:reduce){.toast,.more,.shake,.roll{animation-duration:.01s}.roll{animation:none;top:4cqw}}
</style>
</head>
<body>
<div id="app">
  <div class="shell">
    <header id="hud">
      <div id="chapter">Annette's Big Day</div>
      <div id="hudBtns">
        <button class="hbtn" id="bagBtn" type="button">Collection</button>
        <button class="hbtn" id="muteBtn" type="button" aria-pressed="false">Sound on</button>
      </div>
      <div id="stats"></div>
    </header>
    <div id="screen">
      <canvas id="game" width="240" height="160" aria-label="Game screen"></canvas>
      <div id="ui" aria-live="polite"></div>
      <div id="toasts"></div>
      <div id="np" hidden></div>
      <div id="fade"></div>
    </div>
    <div id="pad">
      <div id="dpad">
        <button class="u" data-dir="up" aria-label="Up">&#9650;</button>
        <button class="l" data-dir="left" aria-label="Left">&#9664;</button>
        <span class="c"></span>
        <button class="r" data-dir="right" aria-label="Right">&#9654;</button>
        <button class="d" data-dir="down" aria-label="Down">&#9660;</button>
      </div>
      <div id="ab">
        <button class="round" id="bBtn" type="button" aria-label="B button, back">B</button>
        <button class="round" id="aBtn" type="button" aria-label="A button, action">A</button>
      </div>
    </div>
  </div>
  <p class="help">Keyboard: arrows or WASD to move, Space or Enter for A, X or Esc for B.</p>
</div>

<script>
'use strict';

/* =========================================================
   EDIT ME: personal details. Change these before the big day.
   ========================================================= */
const CONFIG = {
  name: "Annette",
  boyfriend: "Paulo",
  car: "Joanne",                   // the blue Corolla
  company: "National Intermodal",
  dinnerSpot: "The Botanist, Kirribilli",
  catchphrase: "Say less.",
  radio: ["Tupac", "J. Cole", "Kendrick Lamar"],
  // Song titles shown as "now playing" (naming songs, not reproducing lyrics).
  radioBars: {
    "Tupac": ["California Love", "Changes", "Dear Mama", "Keep Ya Head Up"],
    "J. Cole": ["No Role Modelz", "Middle Child", "Work Out", "She Knows"],
    "Kendrick Lamar": ["HUMBLE.", "Alright", "DNA.", "Money Trees"]
  },
  drinks: [
    { n: "Pina colada", d: "Her go-to. Extra pineapple." },
    { n: "Red wine", d: "A big glass of shiraz" },
    { n: "Espresso martini", d: "Night-out fuel" },
    { n: "Say-less spritz", d: "Bartender special. No questions." }
  ],
  dishes: [
    { n: "Steak frites", d: "Medium rare, obviously" },
    { n: "Share plates", d: "A bit of everything" },
    { n: "Truffle fries", d: "Extra parmesan" },
    { n: "Sticky date pudding", d: "Dessert first. It's a birthday." }
  ],
  lunches: [
    { n: "Tonkotsu ramen", d: "That new ramen place everyone's on about." },
    { n: "Banh mi", d: "Crunchy, fresh and fast." },
    { n: "Food from home", d: "Portuguese chicken and rice. Cosy and packed with love." },
    { n: "Read my Kobo", d: "A cheeky chapter or two on the break." }
  ],
  // Three inside jokes. Swap in your own.
  insideJokes: [
    "Happy birthday! I heard your boyfriend still can't out-lift you.",
    "Is it true you have a spreadsheet for your spreadsheets?",
    "Scratched into the shell: 'Luca was here. Luca is always here.'"
  ],
  secrets: {
    owl: ["An owl is tapping on the window with a letter tied to its leg.", "The letter reads: Happy birthday! Your real adventure starts today."],
    book: ["Her favourite fantasy series, spines cracked from rereading.", "A bookmark sits at chapter one again. Time for another reread."],
    card: ["Taped inside the locker: a shiny holographic trading card.", "It shows a sleepy sea-otter creature. Ultra rare!"],
    poster: ["A poster for the bar's rooftop film night.", "A mob family saga, then a mind-bending space epic. Popcorn is already booked."]
  },
  // Paulo's finale speech. One line per dialogue box.
  finaleMessage: [
    "A PR at the gym, exec reports smashed, a good lunch, and now cocktails by the harbour. What a day.",
    "You do so much! How lucky am I!!",
    "Happy birthday my Annette. I love you.",
    "Now let's ignore the Harbour Bridge again!"
  ]
};

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const cv = $('#game'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const ui = $('#ui'), toasts = $('#toasts'), fadeEl = $('#fade');
const INK = '#231d33';
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function R(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); }
function hsh(x, y, n) { let h = (x * 374761393 + y * 668265263 + n * 982451653) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) % 1000 / 1000; }
function oval(cx, cy, rx, ry, fill, stroke) { ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); if (stroke) { ctx.lineWidth = 2; ctx.strokeStyle = stroke; ctx.stroke(); } }

/* ---------------- sprites ---------------- */
const BODY = [
  "...KTTTSSTTTK...", "..KSTTTTTTTTSK..", "..KSTtTTTTtTSK..", "..KSKTTTTTTKSK..",
  "...KKbbbbbbKK...", "....KPPPPPPK....", "....KPPKKPPK....", "....KBBKKBBK....", "....KKK..KKK...."
];
const girlPal = { K: INK, S: "#f9d1b0", s: "#e6a57f", R: "#f4a3a8", L: "#d9637a", E: "#3d7be0", H: "#f5d271", h: "#d8a441", T: "#ff6f91", t: "#c94a6e", P: "#2b2d42", p: "#1c1d2c", B: "#f4f6fb" };
const HEAD_F = ["....KKKKKKKK....", "...KHHHHHHHHK...", "..KHHHHHHHHHHK..", "..KHhHHHHHHhHK..", "..KHhSSSSSShHK..", "..KHSSSSSSSSHK..", "..KHSEESSEESHK..", "..KHRSSSSSSRHK..", "..KHSSSLLSSSHK..", "..KHhKSSSSKhHK..", "..KHHKKSSKKHHK..",
  "..KHKTTSSTTKHK..", "..KHTTTTTTTTHK..", "..KhTtTTTTtThK..", "..KSKTTTTTTKSK.."];
const HEAD_B = ["....KKKKKKKK....", "...KHHHHHHHHK...", "..KHHHHHHHHHHK..", "..KHhHHHHHHhHK..", "..KHHHhHHhHHHK..", "..KHHHHHHHHHHK..", "..KHhHHHHHHhHK..", "..KHHHHHHHHHHK..", "..KhHHHHHHHHhK..", "..KHHHHHHHHHHK..", "..KHHhHHHHhHHK..",
  "..KHHHHHHHHHHK..", "..KSHHHHHHHHSK..", "..KShHHHHHHhSK..", "..KSKhHHHHhKSK.."];
const LOWER = {
  pants: ["...KKTTTTTTKK...", "....KPPPPPPK....", "....KPPKKPPK....", "....KBBKKBBK....", "....KKK..KKK...."],
  crop: ["...KKSSSSSSKK...", "....KPPPPPPK....", "....KPPKKPPK....", "....KBBKKBBK....", "....KKK..KKK...."],
  dress: ["...KTTTTTTTTK...", "..KTTTTTTTTTTK..", "..KKKKKKKKKKKK..", "....KSSKKSSK....", "....KKK..KKK...."]
};
const SPR = {
  annette_pants: { pal: girlPal, rows: HEAD_F.concat(LOWER.pants) },
  annette_crop: { pal: girlPal, rows: HEAD_F.concat(LOWER.crop) },
  annette_dress: { pal: girlPal, rows: HEAD_F.concat(LOWER.dress) },
  annette_back_pants: { pal: girlPal, rows: HEAD_B.concat(LOWER.pants) },
  annette_back_crop: { pal: girlPal, rows: HEAD_B.concat(LOWER.crop) },

  const d = Math.abs(L.pos - L.zc), half = L.zw / 2;
  const r = d <= half * 0.4 ? 'perfect' : d <= half ? 'good' : 'miss';
  L.res.push(r); L.el.querySelectorAll('.rep')[L.rep].classList.add(r);
  sfx(r === 'miss' ? 'bad' : 'good');
  L.rep++;
  L.el.querySelector('.result').textContent = (r === 'perfect' ? 'Perfect rep!' : r === 'good' ? 'Good rep.' : 'Missed the groove.') + (L.rep < 3 ? '  Rep ' + (L.rep + 1) + ' of 3' : '');
  if (L.rep >= 3) { L.end = 0.8; return; }
  L.lock = 0.45; L.speed += 0.22; L.zw = Math.max(0.1, L.zw - 0.012); L.zc = 0.25 + Math.random() * 0.5; placeZone();
}
function finishLift() {
  const L = G.lift, good = L.res.filter(r => r !== 'miss').length, perfect = L.res.filter(r => r === 'perfect').length;
  G.lift = null; clearUI(); F.lifted = true; G.mode = 'map';
  stat('gains', perfect * 4 + good * 2); stat('energy', -8);
  if (good >= 3) { F.pr = true; sfx('pr'); earn('gains'); say(["NEW PR! Annette just lifted her heaviest ever.", "The whole gym turns around. Luca barks in approval.", "Time to head to work."]); }
  else say(["Solid session. " + good + " clean reps.", "Time to head to work."]);
}

  else if (th === 'office') { R(X, Y, 16, 16, '#a9bccf'); R(X, Y, 16, 1, '#9db1c5'); R(X, Y, 1, 16, '#9db1c5'); R(X + 7, Y + 7, 2, 2, '#95aac0'); }
  else if (th === 'botanist') { R(X, Y, 16, 16, '#8a5a3b'); R(X, Y + 3, 16, 1, '#744a2f'); R(X, Y + 11, 16, 1, '#744a2f'); R(X + ((tx + ty) % 2 ? 5 : 12), Y + 4, 1, 7, '#744a2f'); }
  else { R(X, Y, 16, 16, '#f6dfa6'); for (let i = 0; i < 3; i++) R(X + Math.floor(hsh(tx, ty, i) * 15), Y + Math.floor(hsh(ty, tx, i + 5) * 15), 1, 1, '#e3c47f'); }
}

function renderMap() {
  const th = G.map.def.theme, tiles = G.map.tiles, wo = WALLOBJ[th] || '', ob = OBJ[th] || '';
  for (let ty = 0; ty < tiles.length; ty++) for (let tx = 0; tx < tiles[0].length; tx++) {
    const c = tiles[ty][tx], X = tx * 16, Y = ty * 16;
    if (c === '#' || wo.includes(c)) drawWall(th, X, Y, tx, ty, tiles);
    else if (c === '~') { R(X, Y, 16, 16, '#4fa9e3'); R(X + ((tx * 5 + Math.floor(G.t * 6)) % 16) - 2, Y + 4 + (ty % 2) * 6, 6, 1, '#bfe3ff'); R(X + ((tx * 9 + Math.floor(G.t * 4)) % 16) - 2, Y + 11 - (ty % 2) * 6, 4, 1, '#8dcaf0'); }
    else if (c === '_') { R(X, Y, 16, 16, '#e9cf8f'); const f = Math.floor(G.t * 3 + tx) % 3; R(X, Y, 16, 2, '#ffffff'); R(X + 2 + f * 3, Y + 2, 5, 1, '#ffffff'); }
    else if (c === 'D') { drawFloor(th, X, Y, tx, ty); R(X + 1, Y + 2, 14, 12, INK); R(X + 2, Y + 3, 12, 10, '#7fa383'); R(X + 4, Y + 5, 8, 1, '#5c7d60'); R(X + 4, Y + 9, 8, 1, '#5c7d60'); }
    else drawFloor(th, X, Y, tx, ty);
  }
  for (let ty = 0; ty < tiles.length; ty++) for (let tx = 0; tx < tiles[0].length; tx++) {
    const c = tiles[ty][tx];
    if (ob.includes(c) && isOrigin(tiles, tx, ty, c)) { const [W, H] = extent(tiles, tx, ty, c); drawObject(th, c, tx * 16, ty * 16, W, H); }
  }
  // entities
  const ents = [];
  const def = G.map.def;
  for (let ty = 0; ty < tiles.length; ty++) for (let tx = 0; tx < tiles[0].length; tx++) {
    const c = tiles[ty][tx];
    const n = def.npc && def.npc(c, tx, ty);
    if (n) ents.push({ y: ty * 16, d: () => { R(tx * 16 + 3, ty * 16 + 14, 10, 2, 'rgba(35,29,51,.22)'); drawSpr(sprite(n[0], n[1]), tx * 16, ty * 16 - 4, false); } });
    if (c === 'h') ents.push({ y: ty * 16, d: () => drawSpr(sprite('heart'), tx * 16 + 4, ty * 16 + 5 + Math.round(Math.sin(G.t * 4 + tx) * 1.5), false) });
    if (c === 'q') ents.push({ y: ty * 16, d: () => drawSpr(sprite('cake'), tx * 16 + 1, ty * 16 + 3, false) });
  }
  const p = G.p, l = G.l;
  const pb = p.mv ? (Math.floor(p.mv.t * 4) % 2) : 0, lb = l.mv ? (Math.floor(l.mv.t * 4) % 2) : 0;
  ents.push({ y: l.py, d: () => { R(l.px + 3, l.py + 14, 10, 2, 'rgba(35,29,51,.22)'); drawSpr(sprite('luca'), l.px, l.py + 2 - lb, l.flip); } });
  ents.push({ y: p.py + 0.5, d: () => { R(p.px + 3, p.py + 14, 10, 2, 'rgba(35,29,51,.22)'); drawSpr(annetteSprite(p.dir === 'up'), p.px, p.py - 4 - pb, false); } });
  ents.sort((a, b) => a.y - b.y).forEach(e => e.d());
  // objective markers
  const hs = (def.hints ? def.hints() : []).filter(Boolean);
  hs.forEach(c => {
    for (let ty = 0; ty < tiles.length; ty++) for (let tx = 0; tx < tiles[0].length; tx++) {
      if (tiles[ty][tx] !== c || !isOrigin(tiles, tx, ty, c)) continue;
      const [W] = ob.includes(c) ? extent(tiles, tx, ty, c) : [16];
      const x = tx * 16 + W / 2 - 4, y = Math.max(1, ty * 16 - 20) + Math.round(Math.sin(G.t * 5) * 2);
      R(x, y, 8, 10, INK); R(x + 1, y + 1, 6, 8, '#ffd166'); R(x + 3, y + 2, 2, 4, INK); R(x + 3, y + 7, 2, 1, INK);
    }
  });
}

function renderFinale() {

  // harbour water
  R(0, 96, 240, 20, '#27335e');
  for (let i = 0; i < 16; i++) R(((i * 29 + G.t * 8) % 250) - 10, 100 + (i % 4) * 4, 8, 1, ['#ffd166', '#ff6f91', '#7fc8f8'][i % 3]);
  // Sydney Harbour Bridge - prominent lit silhouette (the coathanger)

  ctx.strokeStyle = '#55628e'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(bx, by + 46, R2, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();

  for (let x = bx - span + 16; x < bx + span - 14; x += 8) { const ay = archY(x); R(x, ay, 1, by - ay, '#46527d'); R(x, ay - 1, 1, 1, '#ffd166'); } // hangers + arch lights
  for (let x = bx - span; x < bx + span; x += 7) R(x, by - 1, 1, 1, '#ffe9a8'); // deck lights
  // deck, fairy lights, table
  R(0, 116, 240, 44, '#6b4228'); for (let y = 120; y < 160; y += 6) R(0, y, 240, 1, '#5a3620');
  R(0, 112, 240, 4, '#2f5d4a');
  ctx.strokeStyle = '#3a3040'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, 6); ctx.quadraticCurveTo(120, 34, 240, 6); ctx.stroke();
  for (let i = 0; i < 16; i++) { const x = 8 + i * 15, y = 6 + Math.sin(Math.PI * x / 240) * 14; R(x, y, 2, 2, (Math.floor(G.t * 3) + i) % 4 ? '#ffd166' : '#fff5d6'); }
  R(150, 128, 40, 4, INK); R(151, 129, 38, 2, '#ffffff'); R(168, 132, 4, 16, INK);
  drawSpr(sprite('cake'), 163, 114, false, 1);
  R(154, 121, 3, 7, '#ffd166'); R(154, 119, 3, 2, '#ffffff'); R(184, 121, 3, 5, '#8e1f3a'); R(185, 126, 1, 2, INK);
  drawSpr(sprite('luca'), 30, 136 + (Math.floor(G.t * 4) % 2), false, 1);
  drawSpr(annetteSprite(false, 'dress'), 70, 108, false, 2);
  drawSpr(sprite('paulo'), 108, 108, false, 2);
  drawSpr(sprite('heart'), 99, 94 + Math.round(Math.sin(G.t * 3) * 2), false, 2);
}

/* ---------------- loop ---------------- */
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; G.t += dt;
  if (G.dlg) {
    const d = G.dlg, line = d.lines[d.i];
    if (d.shown < line.t.length) {
      const prev = Math.floor(d.shown); d.shown = Math.min(line.t.length, d.shown + dt * 55);
      const n = Math.floor(d.shown);
      if (n !== prev) { d.p.textContent = line.t.slice(0, n); if (n % 3 === 0) sfx('talk'); }
      if (d.shown >= line.t.length) d.more.hidden = false;
    }
  }
  if (G.scene === 'map') updateMap(dt);
  else if (G.scene === 'drive') updateDrive(dt);
  else if (G.scene === 'finale' || G.scene === 'credits') updateFinale(dt);
  if (G.mode === 'lift') updateLift(dt);
  nowPlaying();
  ctx.clearRect(0, 0, 240, 160);
  if (G.scene === 'title') renderTitle();
  else if (G.scene === 'map') renderMap();
  else if (G.scene === 'drive') renderDrive();
  else if (G.scene === 'lunch') renderLunch();
  else if (G.scene === 'battle') renderBattle();
  else if (G.scene === 'finale' || G.scene === 'credits') renderFinale();
  requestAnimationFrame(loop);
}

/* ---------------- title ---------------- */
function showTitle() {
  G.scene = 'title'; clearUI(); setChapter(CONFIG.name + "'s Big Day");
  ui.append(el('div', 'titlecard', '<h1>' + esc(CONFIG.name) + "'s Big Day</h1><p>A birthday adventure across one sunny Sydney day</p>"));
  ui.append(el('p', 'howto', 'Move with the arrows. A to talk and interact. B opens your collection. There are 4 SECRET ITEMS to find!'));
  const b = makeBtn('Press start', () => fade(() => loadMap('bedroom'))); b.classList.add('start');
  ui.append(b); setMenu([b]); music('title');
}
showTitle();
requestAnimationFrame(loop);
