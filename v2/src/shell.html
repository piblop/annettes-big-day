<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Annette's Big Day v2</title>
<meta name="description" content="A whimsical 3D diorama of Annette's birthday, made with love by Paulo.">
<meta name="theme-color" content="#ffd9e6">
<meta property="og:title" content="Annette's Big Day v2">
<meta property="og:description" content="The whimsical edition: one big day across floating islands.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 14 2 8a3.2 3.2 0 0 1 6-3.6A3.2 3.2 0 0 1 14 8z' fill='%23ff7aa8'/%3E%3C/svg%3E">
<style>
/*FONTS*/
:root {
  --paper:#fff8ee; --paper2:#fff1e0; --ink:#5a3d2b; --ink2:#8a6a55; --tan:#ecd3ae; --pink:#ff7aa8; --pink2:#ffd1e1;
  --leaf:#7cc576; --orange:#ffa94d; --lilac:#b9a3ff; --sky:#bfe6ff; --r:18px;
  --shadow:0 6px 18px rgba(120,80,60,.18), 0 2px 4px rgba(120,80,60,.12);
  box-sizing:border-box;
}
*, *::before, *::after { box-sizing:inherit; }
html, body { margin:0; height:100%; overflow:hidden; background:linear-gradient(#ffd9e6, #bfe6ff); color:var(--ink);
  font-family:'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif; user-select:none; -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent; overscroll-behavior:none; }
#view { position:fixed; inset:0; touch-action:none; }
#view canvas { display:block; }
button { font-family:'Fredoka', system-ui, sans-serif; }
.hidden { display:none !important; }

/* ---------- HUD ---------- */
#hud { position:fixed; left:0; right:0; top:0; padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0; display:flex; gap:8px; align-items:flex-start; pointer-events:none; z-index:5; }
#hud > * { pointer-events:auto; }
.pill { background:var(--paper); border:2px solid var(--tan); border-radius:999px; box-shadow:var(--shadow); padding:6px 14px; font:600 14px 'Fredoka', system-ui, sans-serif; color:var(--ink); white-space:nowrap; }
#chapter { max-width:46vw; overflow:hidden; text-overflow:ellipsis; }
#clock { font-variant-numeric:tabular-nums; }
#needs { display:flex; gap:10px; background:var(--paper); border:2px solid var(--tan); border-radius:16px; box-shadow:var(--shadow); padding:6px 12px; }
.need { display:flex; flex-direction:column; gap:3px; font:600 11px 'Fredoka', sans-serif; min-width:54px; }
.need i { display:block; height:8px; border-radius:99px; background:#f1e4d2; overflow:hidden; }
.need b { display:block; height:100%; border-radius:99px; transition:width .5s cubic-bezier(.3,1.6,.5,1), background .5s; }
#hudBtns { margin-left:auto; display:flex; gap:6px; }
.ib { border:2px solid var(--tan); background:var(--paper); color:var(--ink); border-radius:999px; box-shadow:var(--shadow); padding:6px 12px; font:600 14px 'Fredoka', sans-serif; cursor:pointer; }
.ib:active { transform:scale(.94); }
@media (max-width:520px) { #chapter { position:absolute; left:12px; top:calc(54px + env(safe-area-inset-top,0px)); max-width:calc(100vw - 24px); } }
.photo { position:fixed; inset:0; z-index:70; display:grid; place-items:center; background:rgba(58,40,30,.45); animation:fadeIn .2s; padding:16px; }
.photo .snap { background:#fffdf8; padding:12px 12px 16px; border-radius:18px; box-shadow:var(--shadow); max-width:min(560px, 100%); transform:rotate(-1.5deg); animation:popIn .35s cubic-bezier(.3,1.6,.5,1); text-align:center; }
.photo img { width:100%; border-radius:10px; display:block; }
.photo p { font:500 13px 'Figtree', sans-serif; color:var(--ink2); margin:8px 0 10px; }
.photo a.big { text-decoration:none; display:inline-block; }
.album .logs .got { animation:optIn .4s backwards; }
@media (max-width:700px) { #needs { display:none; } #chapter { max-width:40vw; } .pill, .ib { font-size:13px; padding:5px 10px; } }

/* ---------- overlays ---------- */
#ui { position:fixed; inset:0; pointer-events:none; z-index:10; display:flex; align-items:center; justify-content:center; }
#ui > * { pointer-events:auto; }
.panel { background:var(--paper); border:3px solid var(--tan); border-radius:26px; box-shadow:var(--shadow), 0 0 0 6px rgba(255,255,255,.5); padding:18px 20px 20px; width:min(560px, calc(100vw - 32px)); max-height:calc(100vh - 120px); overflow:auto; animation:popIn .35s cubic-bezier(.3,1.6,.5,1); }
.panel h2 { font:700 max(22px, 2.4vw) 'Fredoka', sans-serif; margin:0 0 2px; color:var(--ink); }
.panel .sub { margin:0 0 12px; color:var(--ink2); font-size:15px; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
@media (max-width:460px) { .grid2 { grid-template-columns:1fr; } }
.opt { display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:left; padding:12px 14px; border-radius:18px; border:2px solid var(--tan); background:#fff; color:var(--ink); font:600 16px 'Fredoka', sans-serif; cursor:pointer; box-shadow:0 3px 0 var(--tan); transition:transform .12s, background .12s; }
.opt small { font:400 13px 'Figtree', sans-serif; color:var(--ink2); }
.opt { animation:optIn .45s cubic-bezier(.3,1.5,.5,1) backwards; animation-delay:calc(.1s + var(--i, 0) * .06s); }
.opt.has-pic { flex-direction:row; align-items:center; gap:12px; }
.opt .txt { display:flex; flex-direction:column; gap:2px; min-width:0; }
.pic { flex:none; width:46px; height:46px; border-radius:15px; display:grid; place-items:center; font-style:normal; background:radial-gradient(circle at 35% 30%, #fff 0, #fff4e0 55%, #ffe3c2 100%); box-shadow:inset 0 -3px 0 rgba(236,211,174,.8), 0 2px 4px rgba(90,61,43,.12); }
.pic::before, .moment i::before, .flypic::before { content:attr(data-e); font-size:28px; line-height:1; font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif; color:var(--ink); }
.opt[data-kind=special] .pic { background:radial-gradient(circle at 35% 30%, #fff 0, #fff4b0 60%, #ffd166 100%); }
.opt[data-kind=cart] .pic { background:radial-gradient(circle at 35% 30%, #fff 0, #e4f6dc 60%, #bfe6a8 100%); }
.opt:hover .pic, .opt.focus .pic { animation:wiggle .9s ease-in-out infinite; }
.opt.tap { animation:tapPop .3s cubic-bezier(.3,1.8,.5,1); }
.opt.done .pic::after { content:'✓'; position:absolute; font:700 18px 'Fredoka', sans-serif; color:#3fae7c; transform:translate(16px, 14px); }
.opt.done .pic { position:relative; }
@keyframes optIn { from { opacity:0; transform:translateY(14px) scale(.9); } }
@keyframes wiggle { 0%,100% { transform:rotate(0) scale(1); } 25% { transform:rotate(-9deg) scale(1.1); } 55% { transform:rotate(7deg) scale(1.06); } }
@keyframes tapPop { 40% { transform:scale(.94); } 75% { transform:scale(1.05); } }
.cnt.bump, .bump { animation:tapPop .35s; }
.flypic { position:fixed; z-index:60; width:46px; height:46px; display:grid; place-items:center; font-style:normal; pointer-events:none; }
.moment { position:fixed; inset:0; z-index:55; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:radial-gradient(circle, rgba(255,248,238,.55), rgba(255,248,238,0) 70%); animation:fadeIn .2s; cursor:pointer; }
.moment.out { opacity:0; transition:opacity .25s; }
.moment .stage { position:relative; width:230px; height:190px; border-radius:50%; background:radial-gradient(circle at 50% 40%, #fff 0, var(--paper) 55%, var(--paper2) 100%); border:3px solid var(--tan); box-shadow:var(--shadow), 0 0 0 8px rgba(255,255,255,.55); animation:popIn .4s cubic-bezier(.3,1.6,.5,1); }
.moment i { position:absolute; left:50%; top:50%; width:120px; height:120px; margin:-60px 0 0 -60px; display:grid; place-items:center; font-style:normal; }
.moment .hero::before { font-size:84px; }
.moment .hero { animation:heroIn .6s cubic-bezier(.3,1.7,.5,1) backwards, heroBob 1.2s .6s ease-in-out infinite; }
.moment .cap { background:var(--paper); border:2px solid var(--tan); border-radius:999px; padding:8px 20px; box-shadow:var(--shadow); text-align:center; animation:popIn .4s .15s cubic-bezier(.3,1.6,.5,1) backwards; display:flex; flex-direction:column; }
.moment .cap b { font:700 max(18px, 1.6vw) 'Fredoka', sans-serif; color:var(--ink); }
.moment .cap small { font:500 13px 'Figtree', sans-serif; color:var(--ink2); }
.moment .spark { width:10px; height:10px; margin:-5px; border-radius:50%; background:var(--pink); opacity:0; animation:burst .8s var(--d) ease-out forwards; }
.moment .spark:nth-child(3n) { background:#ffd166; } .moment .spark:nth-child(3n+1) { background:#7fc8f8; }
.moment .glass::before { font-size:44px; }
.moment .glass.l { animation:clinkL 1.1s .2s cubic-bezier(.4,1.4,.5,1) both; }
.moment .glass.r { animation:clinkR 1.1s .2s cubic-bezier(.4,1.4,.5,1) both; }
.moment .steam { width:10px; height:26px; margin:-60px 0 0 -5px; border-radius:10px; background:rgba(255,255,255,.95); box-shadow:0 0 8px rgba(255,255,255,.9); opacity:0; animation:steam 1.4s ease-out infinite; }
.moment .steam.s2 { margin-left:-22px; animation-delay:.35s; } .moment .steam.s3 { margin-left:12px; animation-delay:.7s; }
.moment .prop::before { font-size:34px; }
.moment .prop { animation:propIn .5s calc(.25s + var(--i) * .12s) cubic-bezier(.3,1.6,.5,1) backwards; }
.moment .prop.p0 { transform:translate(-80px, 30px); } .moment .prop.p1 { transform:translate(80px, 30px); } .moment .prop.p2 { transform:translate(0, -70px); }
.k-dine .prop::before { animation:flicker .5s ease-in-out infinite alternate; display:block; }
.k-snow .prop::before, .k-trip .prop::before, .k-adventure .prop::before, .k-music .prop::before, .k-hug .prop::before, .k-outfit .prop::before, .k-glow .prop::before { display:block; animation:floatUp 1.4s ease-in-out infinite; }
.k-movie .prop.p0, .k-picnic .prop.p0, .k-read .prop.p0, .k-cart .prop.p0 { transform:translate(64px, 36px); }
.k-cart .prop.p0::before { font-size:56px; }
.k-chess .prop.p0 { transform:translate(0, -64px); } .k-chess .prop.p0::before { display:block; animation:crown .7s .5s cubic-bezier(.3,1.7,.5,1) backwards; }
.k-special .hero { animation:heroIn .6s cubic-bezier(.3,1.7,.5,1) backwards, spin 1.4s .6s ease-in-out infinite; }
.moment .pop::before { font-size:22px; }
.moment .pop { opacity:0; animation:popcorn .9s var(--d) cubic-bezier(.2,.8,.4,1) forwards; }
.moment .drop::before { font-size:30px; }
.moment .drop { opacity:0; animation:drop .5s var(--d) cubic-bezier(.5,0,.8,1.4) forwards; }
.moment.still *, .moment.still { animation:none !important; opacity:1; }
.moment.still .spark, .moment.still .pop, .moment.still .steam { display:none; }
@keyframes fadeIn { from { opacity:0; } }
@keyframes heroIn { from { transform:scale(0) rotate(-25deg); } }
@keyframes heroBob { 50% { transform:translateY(-6px) rotate(3deg); } }
@keyframes spin { 50% { transform:rotate(12deg) scale(1.08); } }
@keyframes burst { 0% { opacity:1; transform:translate(0,0) scale(1.4); } 100% { opacity:0; transform:translate(var(--dx), var(--dy)) scale(.3); } }
@keyframes clinkL { 0% { transform:translate(-160px, 20px) rotate(-10deg); opacity:0; } 45% { transform:translate(-26px, -40px) rotate(18deg); opacity:1; } 55% { transform:translate(-34px, -42px) rotate(8deg); } 100% { transform:translate(-62px, -30px) rotate(0); } }
@keyframes clinkR { 0% { transform:translate(160px, 20px) rotate(10deg) scaleX(-1); opacity:0; } 45% { transform:translate(26px, -40px) rotate(-18deg) scaleX(-1); opacity:1; } 55% { transform:translate(34px, -42px) rotate(-8deg) scaleX(-1); } 100% { transform:translate(62px, -30px) rotate(0) scaleX(-1); } }
@keyframes steam { 0% { opacity:0; transform:translateY(0) scaleY(.6); } 30% { opacity:.9; } 100% { opacity:0; transform:translateY(-34px) scaleY(1.2) translateX(6px); } }
@keyframes propIn { from { opacity:0; transform:translate(0,0) scale(0); } }
@keyframes flicker { from { transform:scale(1) rotate(-3deg); } to { transform:scale(1.08) rotate(3deg); } }
@keyframes floatUp { 50% { transform:translateY(-12px) rotate(8deg); } }
@keyframes crown { from { transform:translateY(-60px) scale(.4); opacity:0; } }
@keyframes popcorn { 0% { opacity:1; transform:translate(0, 10px) scale(.4); } 60% { opacity:1; transform:translate(calc(var(--dx) * .7), var(--dy)) scale(1) rotate(160deg); } 100% { opacity:0; transform:translate(var(--dx), 40px) rotate(300deg); } }
@keyframes drop { 0% { opacity:1; transform:translate(var(--x), -130px) rotate(-30deg); } 100% { opacity:1; transform:translate(calc(var(--x) * .45), -14px) scale(.75) rotate(10deg); } }
.opt.focus { background:var(--pink2); border-color:var(--pink); box-shadow:0 3px 0 var(--pink); transform:translateY(-2px) rotate(-.6deg); }
.opt:disabled, .opt.done { opacity:.45; }
.opt:active { transform:translateY(2px); box-shadow:0 1px 0 var(--tan); }
.panel.low { align-self:flex-end; margin-bottom:calc(14px + env(safe-area-inset-bottom,0px)); }
.shake { animation:shake .35s; }
@keyframes shake { 20%,60% { transform:translateX(-8px); } 40%,80% { transform:translateX(8px); } }
@keyframes popIn { from { transform:scale(.7) rotate(-2deg); opacity:0; } to { transform:none; opacity:1; } }

/* dialogue */
#dlg { position:fixed; left:50%; bottom:calc(14px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); width:min(680px, calc(100vw - 24px)); background:var(--paper); border:3px solid var(--tan); border-radius:24px; box-shadow:var(--shadow); padding:22px 22px 18px; z-index:12; cursor:pointer; animation:popIn .3s cubic-bezier(.3,1.6,.5,1); }
#dlg.her { background:#fff3f7; border-color:#ffc2d6; }
#dlg .who { position:absolute; top:-15px; left:18px; padding:3px 14px; border-radius:999px; font:700 15px 'Fredoka', sans-serif; color:#fff; background:var(--ink2); box-shadow:0 3px 0 rgba(0,0,0,.12); }
#dlg .txt { font:500 max(17px, 1.5vw) 'Fredoka', sans-serif; line-height:1.4; min-height:2.8em; }
#dlg .more { position:absolute; right:18px; bottom:10px; color:var(--pink); animation:bob 1s ease-in-out infinite; font-size:14px; }
@keyframes bob { 50% { transform:translateY(-4px); } }

#toasts { position:fixed; top:calc(64px + env(safe-area-inset-top,0px)); left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:6px; z-index:20; pointer-events:none; }
.toast { background:var(--paper); border:2px solid var(--tan); border-radius:999px; padding:7px 16px; font:600 15px 'Fredoka', sans-serif; box-shadow:var(--shadow); animation:toastIn 2.6s ease forwards; }
.toast.gold { background:#fff4c9; border-color:#ffd166; }
@keyframes toastIn { 0% { transform:translateY(-12px) scale(.8); opacity:0; } 10% { transform:none; opacity:1; } 85% { opacity:1; } 100% { opacity:0; transform:translateY(-6px); } }

#card { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:15; pointer-events:none; }
#card span { font:700 max(30px, 4.4vw) 'Fredoka', sans-serif; color:#fff; text-shadow:0 3px 0 rgba(90,61,43,.35), 0 0 24px rgba(255,122,168,.6); animation:cardIn 2.4s ease forwards; text-align:center; padding:0 20px; }
@keyframes cardIn { 0% { transform:scale(.4) rotate(-6deg); opacity:0; } 18% { transform:scale(1.08) rotate(2deg); opacity:1; } 28% { transform:scale(1) rotate(0); } 80% { opacity:1; } 100% { opacity:0; transform:translateY(-20px); } }
#fade { position:fixed; inset:0; background:radial-gradient(circle, #fff6fa, #ffd1e1); opacity:0; pointer-events:none; z-index:30; transition:opacity .45s; }
#fade.on { opacity:1; pointer-events:auto; }

/* title */
.title { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:calc(28px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px)); pointer-events:none; }
.title > * { pointer-events:auto; }
.logo { text-align:center; animation:floaty 4s ease-in-out infinite; }
.logo h1 { margin:0; font:700 max(40px, 6.2vw) 'Fredoka', sans-serif; color:#fff; line-height:1; letter-spacing:.5px;
  text-shadow:0 4px 0 #ff7aa8, 0 8px 0 rgba(90,61,43,.25), 0 0 30px rgba(255,255,255,.8); }
.logo .v2 { display:inline-block; margin-top:12px; background:var(--paper); border:2px solid var(--tan); border-radius:999px; padding:4px 14px; font:600 15px 'Fredoka', sans-serif; color:var(--pink); box-shadow:var(--shadow); transform:rotate(-3deg); }
@keyframes floaty { 50% { transform:translateY(-8px) rotate(.5deg); } }
.tbtns { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
.big { padding:14px 26px; border-radius:999px; border:3px solid #fff; background:var(--pink); color:#fff; font:700 20px 'Fredoka', sans-serif; box-shadow:0 5px 0 #d9507f, var(--shadow); cursor:pointer; }
.big.alt { background:var(--leaf); box-shadow:0 5px 0 #4f9a4a, var(--shadow); }
.big.sky { background:#6fb8f0; box-shadow:0 5px 0 #3f86c0, var(--shadow); }
.big.focus { outline:4px solid #fff7a8; outline-offset:2px; }
.big:active { transform:translateY(3px); box-shadow:0 2px 0 #d9507f; }

/* mini-game widgets */
.bar { position:relative; height:34px; border-radius:99px; background:#f1e4d2; border:2px solid var(--tan); overflow:hidden; margin:10px 0; }
.bar .zone { position:absolute; top:0; bottom:0; background:var(--pink2); border-left:2px dashed var(--pink); border-right:2px dashed var(--pink); }
.bar .zone::after { content:''; position:absolute; left:35%; right:35%; top:0; bottom:0; background:var(--pink); opacity:.55; }
.bar .mark { position:absolute; top:3px; bottom:3px; width:10px; margin-left:-5px; border-radius:99px; background:var(--ink); }
.reps { display:flex; gap:8px; justify-content:center; margin:8px 0; }
.rep { width:18px; height:18px; border-radius:50%; background:#f1e4d2; border:2px solid var(--tan); }
.rep.perfect { background:#ffd166; } .rep.good { background:var(--leaf); } .rep.miss { background:#e7b4a4; }
.meter { height:16px; border-radius:99px; background:#f1e4d2; border:2px solid var(--tan); overflow:hidden; }
.meter b { display:block; height:100%; width:0; background:linear-gradient(90deg, #ffb3cc, #ff7aa8); transition:width .15s; }
.chip { display:inline-block; padding:10px 16px; border-radius:16px; background:#fff; border:2px solid var(--tan); font:600 18px 'Fredoka', sans-serif; }
.chip i { display:inline-block; width:14px; height:14px; border-radius:4px; margin-right:8px; vertical-align:-1px; }

/* bottom game bars (battle, pet, lift, drive) */
.dock { position:fixed; left:50%; bottom:calc(14px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); width:min(620px, calc(100vw - 24px)); background:var(--paper); border:3px solid var(--tan); border-radius:24px; box-shadow:var(--shadow); padding:14px 16px; }
.dock h3 { margin:0 0 6px; font:700 18px 'Fredoka', sans-serif; }
.hpbox { position:fixed; background:var(--paper); border:3px solid var(--tan); border-radius:20px; box-shadow:var(--shadow); padding:8px 14px; width:min(260px, 44vw); font:600 15px 'Fredoka', sans-serif; }
.hpbox .n { display:flex; justify-content:space-between; }
.hp { height:10px; border-radius:99px; background:#f1e4d2; overflow:hidden; margin-top:5px; }
.hp b { display:block; height:100%; background:var(--leaf); transition:width .4s; border-radius:99px; }
.ebox { top:calc(64px + env(safe-area-inset-top,0px)); left:14px; }
.pbox { top:calc(64px + env(safe-area-inset-top,0px)); right:14px; }

.credits { position:fixed; inset:0; overflow:hidden; display:flex; justify-content:center; }
.roll { position:absolute; top:100%; width:min(520px, 92vw); text-align:center; color:#fff; text-shadow:0 2px 0 rgba(90,61,43,.4); animation:roll 38s linear forwards; font:500 18px 'Fredoka', sans-serif; }
.roll h3 { font:700 24px 'Fredoka', sans-serif; margin:34px 0 8px; color:#fff4c9; }
.roll p { margin:6px 0; }
@keyframes roll { to { transform:translateY(calc(-100% - 100vh)); } }
.calm .roll { animation-duration:60s; }
.cbtns { position:fixed; bottom:calc(20px + env(safe-area-inset-bottom,0px)); left:0; right:0; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }

/* settings + log */
.row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px dashed var(--tan); font:600 16px 'Fredoka', sans-serif; }
.tog { width:52px; height:30px; border-radius:99px; border:2px solid var(--tan); background:#f1e4d2; position:relative; cursor:pointer; }
.tog::after { content:''; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.2); transition:left .2s cubic-bezier(.3,1.6,.5,1); }
.tog.on { background:var(--leaf); } .tog.on::after { left:25px; }
.logs { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.logs div { border:2px dashed var(--tan); border-radius:14px; padding:8px 10px; font-size:14px; }
.logs div.got { border-style:solid; background:#fff4c9; }
.logs b { font-family:'Fredoka', sans-serif; display:block; }

/* touch pad */
#pad { position:fixed; inset:auto 0 0 0; padding:0 16px calc(16px + env(safe-area-inset-bottom,0px)); display:flex; justify-content:space-between; align-items:flex-end; pointer-events:none; z-index:8; }
#pad > * { pointer-events:auto; }
.dpad { display:grid; grid-template-columns:repeat(3, 50px); grid-template-rows:repeat(3, 50px); gap:4px; }
.dpad button, .ab button { border-radius:16px; border:2px solid rgba(255,255,255,.9); background:rgba(255,248,238,.78); color:var(--ink); font:700 18px 'Fredoka', sans-serif; box-shadow:var(--shadow); touch-action:none; }
.ab { display:flex; gap:10px; align-items:flex-end; }
.ab button { width:64px; height:64px; border-radius:50%; }
.ab .a { background:rgba(255,122,168,.9); color:#fff; transform:translateY(-22px); }

</style>
</head>

<div id="view"></div>
<div id="hud" class="hidden">

  <span id="clock" class="pill">7:30 am</span>
  <div id="needs"></div>
  <div id="hudBtns">
    <button class="ib" id="rotL" title="Rotate (Q)" aria-label="Rotate left">&#10226;</button>
    <button class="ib" id="rotR" title="Rotate (E)" aria-label="Rotate right">&#10227;</button>
    <button class="ib" id="logBtn" title="Collection (B)">Log</button>
    <button class="ib" id="setBtn">Settings</button>
  </div>
</div>
<div id="pad" class="hidden">
  <div class="dpad"><span></span><button data-k="up">&#9650;</button><span></span><button data-k="left">&#9664;</button><span></span><button data-k="right">&#9654;</button><span></span><button data-k="down">&#9660;</button><span></span></div>
  <div class="ab"><button class="b" data-k="b">B</button><button class="a" data-k="a">A</button></div>
</div>
<div id="ui"></div>
<div id="card"></div>
<div id="toasts"></div>
<div id="fade"></div>
